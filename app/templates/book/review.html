{% extends 'base.html' %}

{% block title %}Рецензия на книгу - Электронная библиотека{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <h2 class="mb-4">Написать рецензию</h2>
        <h5 class="text-muted mb-4">Книга: {{ book.title }}</h5>
        
        <div class="card shadow-sm">
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="rating" class="form-label">Оценка</label>
                        <select class="form-select" id="rating" name="rating" required>
                            <option value="5" selected>5 – отлично</option>
                            <option value="4">4 – хорошо</option>
                            <option value="3">3 – удовлетворительно</option>
                            <option value="2">2 – неудовлетворительно</option>
                            <option value="1">1 – плохо</option>
                            <option value="0">0 – ужасно</option>
                        </select>
                    </div>
                    
                    <div class="mb-4">
                        <label for="text" class="form-label">Текст рецензии</label>
                        <textarea class="form-control" id="text" name="text"></textarea>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{{ url_for('main.view_book', book_id=book.id) }}" class="btn btn-secondary">Отмена</a>
                        <button type="submit" class="btn btn-primary">Сохранить</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    document.addEventListener("DOMContentLoaded", function() {
        var easymde = new EasyMDE({ element: document.getElementById('text') });
    });
</script>
{% endblock %}
